<!doctype html><meta charset=utf-8><title>Phase 1 Sandbox</title>
<style>
:root{--bg:#1a1d27;--card:#242938;--c2:#2f364b;--tx:#eef1f7;--mu:#8e97ad;--ac:#ffb62e;--ok:#4cc46a;--bad:#e5534b}
body{margin:0;overflow:hidden;background:#12151d;font:600 13px/1.2 Inter,'Segoe UI',system-ui,sans-serif;color:var(--tx);user-select:none}canvas{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#m{position:fixed;top:14px;left:14px;width:360px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;background:var(--bg);border-radius:16px;box-shadow:0 6px 0 #0d0f15;overflow:hidden}
#m h1{margin:0;padding:14px 16px 10px;font-size:14px;font-weight:800;letter-spacing:.1em}
#tabs{display:flex;gap:5px;padding:0 12px 10px}
.tab{flex:1;padding:8px 0;border-radius:10px;background:var(--card);color:var(--mu);font-size:10px;font-weight:800;letter-spacing:.06em;box-shadow:0 3px 0 #141720;transition:transform .06s}
.tab:active{transform:translateY(3px);box-shadow:none}.tab.on{background:var(--ac);color:#2a1d00;box-shadow:0 3px 0 #b3780a}
#body{overflow:auto;padding:2px 12px;flex:1}
.row{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:center}.nm{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.val{display:flex;align-items:center;gap:5px}.val span{min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.val button{width:24px;height:24px;border-radius:8px;background:var(--c2);font-weight:800;font-size:14px;line-height:1;box-shadow:0 2px 0 #141720;transition:transform .05s}
.val button:active{transform:translateY(2px);box-shadow:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;margin:10px 0 2px;outline:0;background:linear-gradient(90deg,var(--ac) var(--p),#141720 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #141720;cursor:grab}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #141720}
.tg{width:48px;height:26px;border-radius:13px;background:#141720;position:relative;transition:background .12s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .12s}
.tg.on{background:var(--ok)}.tg.on::after{transform:translateX(22px)}
.kbtn{min-width:110px;padding:7px 10px;border-radius:9px;background:var(--c2);font-size:11px;font-weight:800;box-shadow:0 3px 0 #141720}
.kbtn:active{transform:translateY(3px);box-shadow:none}.kbtn.wait{background:var(--ac);color:#2a1d00}
#foot{display:flex;gap:8px;padding:8px 12px 14px}
.btn{flex:1;padding:10px;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:.06em;color:#fff;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:none!important}
#rst{background:var(--bad);box-shadow:0 4px 0 #9a312b}#cls{background:#3a4258;box-shadow:0 4px 0 #262c3e}
#tip{position:fixed;z-index:9;display:none;max-width:230px;background:#fff;color:#161924;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.35;box-shadow:0 3px 0 #0006}
#open{position:fixed;top:14px;left:14px;display:none;padding:9px 14px;border-radius:10px;background:var(--bg);font-weight:800;font-size:11px;box-shadow:0 4px 0 #0d0f15}
#sb{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;background:var(--bg);border-radius:12px;padding:8px 12px;box-shadow:0 4px 0 #0d0f15;font-size:12px}
#sb span{padding:4px 10px;border-radius:8px;background:var(--card)}#sb .you{background:var(--c2)}#sb .out{opacity:.4;text-decoration:line-through}#sb b{color:var(--ac);margin-left:6px}
#bn{position:fixed;top:26%;left:50%;transform:translateX(-50%);display:none;text-align:center;background:var(--bg);border-radius:18px;padding:18px 44px;box-shadow:0 6px 0 #0d0f15;font-size:40px;font-weight:800;letter-spacing:.08em;color:var(--ac)}
#bn small{display:block;font-size:14px;color:var(--tx);letter-spacing:.1em;margin-top:6px}
#sp{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);display:none;background:var(--bg);border-radius:10px;padding:8px 14px;font-size:12px;box-shadow:0 4px 0 #0d0f15}
#nr{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 26px;border-radius:12px;background:var(--ac);color:#2a1d00;font-weight:800;font-size:13px;letter-spacing:.06em;box-shadow:0 5px 0 #b3780a;transition:transform .06s}
#nr:active{transform:translateX(-50%) translateY(5px);box-shadow:none}
#inv{position:fixed;left:14px;bottom:18px;display:flex;flex-direction:column;gap:8px}
#inv .slots{display:flex;gap:8px}#inv .chips{display:flex;gap:6px;flex-wrap:wrap}
.slot{position:relative;width:78px;height:78px;border-radius:14px;background:var(--bg);box-shadow:0 5px 0 #0d0f15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ci{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),var(--c) 58%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 2px 0 rgba(0,0,0,.45)}.ci svg{width:72%;height:72%;fill:none;stroke:var(--e);stroke-width:.17;stroke-linejoin:round}.slot small{font-size:8px;letter-spacing:.06em;color:var(--mu);text-align:center}
.slot{border-bottom:4px solid var(--c,#3a4258)}.slot.cur{background:var(--c2);outline:3px solid var(--c)}.slot.cur small{color:var(--tx)}
.slot em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;font-weight:800;background:var(--ac);color:#2a1d00;padding:2px 7px;border-radius:6px}
.slot.empty{background:transparent;box-shadow:none;border:2px dashed #3a4258}
#inv .chips span{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:8px;padding:4px 9px 4px 5px;font-size:11px;box-shadow:0 3px 0 #0d0f15}
#h{position:fixed;top:14px;right:14px;background:var(--bg);border-radius:12px;padding:10px 14px;text-align:right;white-space:pre;font-size:12px;box-shadow:0 4px 0 #0d0f15}
</style>
<div id=m><h1>LOBBY SETTINGS</h1><div id=tabs></div><div id=body></div>
<div id=foot><button class=btn id=rst>DEFAULTS</button><button class=btn id=cls>CLOSE · H</button></div></div>
<button id=open>SETTINGS · H</button><div id=tip></div><div id=h></div><div id=sb></div><div id=inv></div><div id=bn></div><div id=sp></div><button id=nr>NEW ROUND · R</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="sim.js"></script>
<script>
const DT=1/60,C=Sim.C,$=id=>document.getElementById(id),view={hud:true,cam:8.5};
// ---- remappable input ----
const kb={left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],jump:['KeyW','ArrowUp'],power:['Space']};
try{Object.assign(kb,JSON.parse(localStorage.kb))}catch(e){}
const down=new Set(),held=a=>kb[a].some(c=>down.has(c));let rb=null,tab='DRIVE',jl=false,pl=false;
const NAMES={left:'Steer left',right:'Steer right',jump:'Jump / flight',power:'Use power-up'};
addEventListener('keydown',e=>{
  if(rb){kb[rb]=[e.code];try{localStorage.kb=JSON.stringify(kb)}catch(_){}rb=null;draw();e.preventDefault();return}
  down.add(e.code);if(!w.cars[0].alive){if(kb.left.includes(e.code))spec.i--;if(kb.right.includes(e.code))spec.i++}if(!e.repeat&&kb.jump.includes(e.code))jl=true;if(!e.repeat&&kb.power.includes(e.code))pl=true;if(e.code==='KeyR')reset();if(e.code==='KeyH')toggle();
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>down.delete(e.code));addEventListener('blur',()=>{down.clear();jl=false;pl=false});
// ---- settings UI ----
const G={
 DRIVE:[[C,'speed','Cruise speed',10,60,1,'Constant forward speed of every car.'],
  [C,'steer','Steering rate',.5,6,.1,'How fast the car turns while a steer key is held.'],
  [C,'grip','Ground grip',1,20,.5,'Low = slidey and drifty. High = car snaps to where you point.'],
  [C,'air','Air control',0,10,.5,'Grip while airborne. Low = you keep drifting along your launch direction.']],
 AIR:[[C,'gravity','Gravity',10,100,1,'Fall speed. Higher = snappier, shorter jumps.'],
  [C,'jumpV','Jump force',5,40,.5,'Upward kick of a ground hop.'],
  [C,'rampJump','Ramp jump bonus',0,1,.05,'Extra jump power from ramp speed when you jump on a ramp.'],
  [C,'flightLift','Flight lift',0,50,1,'Upward kick when flight engages. Sets how high flight can climb.'],
  [C,'flightDamp','Flight smoothing',.5,8,.1,'How quickly the lift fades into a glide. Lower = longer climb.'],
  [C,'flightSink','Glide sink',0,10,.5,'How fast you drop while gliding. 0 = level.'],
  [C,'flightMul','Flight speed boost',1,2,.05,'Forward speed multiplier while flying.'],
  [C,'rollTime','Barrel roll time',.2,1.5,.05,'Seconds for the roll when you jump while steering.'],
  [C,'coyote','Late-jump window',0,12,1,'Grace frames after leaving a ramp crest or ledge in which a jump still works as a full jump. After that you are FALLING: no jump, no flight. 0 = off.'],
  [C,'buffer','Early-jump buffer',0,15,1,'Frames before landing in which a press is saved and fires as a ground jump on touchdown.'],
  [C,'flightLock','Flight lockout',0,15,1,'Frames after leaving the ground in which presses are ignored, so spamming jump never pops the wings.']],
 HIT:[[C,'baseBumpForce','Base bump force',0,40,1,'Minimum shove of a head-on hit. Glancing hits get less.'],
  [C,'speedToForceRatio','Speed to force',0,2,.05,'How much the attacker\'s speed adds to impact force. Faster rammer = harder hit.'],
  [C,'defenderKnockbackMult','Defender knockback',.5,5,.1,'Multiplier on the force applied to the car that gets hit.'],
  [C,'attackerRecoil','Attacker recoil',0,1,.01,'Share of the attacker\'s forward speed lost on impact. 0.15 = keeps 85%.']],
 FLOOR:[[C,'fallDelay','Tile fall delay',.1,3,.1,'Seconds between a tile turning red and dropping away.'],
  [C,'regen','Tile respawn delay',1,15,1,'Seconds after a tile drops before it returns to its place.'],
  [C,'regenOff','Respawn off','toggle','Permanent destruction: fallen tiles never return, so the arena only shrinks.']],
 ITEMS:[[C,'puOn','Power-ups on','toggle','Turn item spawning on or off.'],
  [C,'puMax','Items on map',1,6,1,'Maximum uncollected power-ups on the board at once.'],
  [C,'pickupSpawnMinDelay','Spawn delay min',0,10,.5,'Shortest wait (s) before a new item appears after a pickup.'],
  [C,'pickupSpawnMaxDelay','Spawn delay max',1,20,.5,'Longest wait (s) before a new item appears.'],
  [C,'invDup','Duplicate actives','toggle','Allow holding the same active item more than once.'],
  [C,'allowDuplicatePassives','Stack passives','toggle','Allow picking up Power Smash or Energy Shield while already active (adds time / hits). Off = pickup stays on the board.'],
  [C,'powerSmashDuration','Power Smash time',3,40,1,'Seconds Power Smash lasts (+50% mass).'],
  [C,'smashBump','Smash force',1,3,.1,'Bump force multiplier while Power Smash is active.'],
  [C,'shieldHits','Shield hits',1,6,1,'Normal bumps an Energy Shield absorbs before it breaks.'],
  [C,'boostMul','Speed Boost power',1.2,3,.1,'Speed multiplier during a boost.'],
  [C,'boostTime','Speed Boost time',.5,5,.1,'Seconds a boost lasts.'],
  [C,'shockwaveForce','Shockwave force',10,300,5,'Knockback at the epicenter. Fades with distance.'],
  [C,'shockwaveRadius','Shockwave radius',8,80,1,'How far the blast reaches.'],
  [C,'hexCollapseRadius','Collapse radius',0,5,1,'Hex rings hit around the target. 0 = target hex only, 1 = target + 6 neighbors.'],
  [C,'hexCollapseWarningTime','Collapse warning',.05,2,.05,'Seconds the hit tiles stay warning-red before dropping.'],
  [C,'hexCollapseFallSpeed','Collapse fall speed',.5,6,.1,'How fast collapsed tiles drop into the void (1 = normal tile drop).'],
  [C,'oilTime','Oil Slick duration',1,10,.5,'Seconds the car dispenses oil.'],
  [C,'oilLife','Oil lifetime',5,60,1,'Seconds oil stays on the floor.'],
  [C,'oilClearAll','Oil clears for all','toggle','When a car hits oil, remove it for everyone, not just that car.'],
  [C,'ghostPhaseDuration','Ghost Phase time',1,8,.5,'Seconds of intangibility.']],
 VIEW:[[view,'hud','Show HUD','toggle','Show or hide the speed / state readout.'],[view,'cam','Camera distance',5,16,.5,'How far the chase camera sits behind the car.']]};
const tip=$('tip');let saveT=0;const persist=o=>{if(o===C){clearTimeout(saveT);saveT=setTimeout(()=>Sim.saveConfig(),150)}}; // host tweaks survive reloads (localStorage)
function hover(el,txt){el.onmouseenter=()=>{const r=el.getBoundingClientRect(),m=$('m').getBoundingClientRect();tip.textContent=txt;
  tip.style.display='block';tip.style.left=m.right+10+'px';tip.style.top=r.top+'px'};el.onmouseleave=()=>tip.style.display='none'}
const fmt=(v,s)=>(+v).toFixed(s<1?(s<.1?2:1):0);
function draw(){
  $('tabs').innerHTML='';for(const t of [...Object.keys(G),'KEYS']){const b=document.createElement('button');b.className='tab'+(t===tab?' on':'');
    b.textContent=t;b.onclick=()=>{tab=t;draw()};$('tabs').appendChild(b)}
  const B=$('body');B.innerHTML='';tip.style.display='none';
  if(tab==='KEYS'){for(const a in kb){const r=document.createElement('div');r.className='row top';r.innerHTML=`<span class=nm>${NAMES[a]}</span>`;
    const b=document.createElement('button');b.className='kbtn'+(rb===a?' wait':'');b.textContent=rb===a?'PRESS A KEY':kb[a].join(' / ').replace(/Key|Arrow/g,'');
    b.onclick=()=>{rb=a;draw()};r.appendChild(b);hover(r,'Click, then press the key you want. Saved on this device.');B.appendChild(r)}return}
  for(const[o,k,n,a,b,s,d]of G[tab]){const r=document.createElement('div');r.className='row';hover(r,d||s);if(k==='regen'&&C.regenOff)r.style.opacity=.45;
    if(a==='toggle'){r.className='row top';r.innerHTML=`<span class=nm>${n}</span><button class="tg${o[k]?' on':''}"></button>`;hover(r,b);
      r.querySelector('.tg').onclick=e=>{o[k]=!o[k];persist(o);e.target.classList.toggle('on',o[k]);if(k==='hud')$('h').style.display=o[k]?'block':'none';if(k==='regenOff')draw()};B.appendChild(r);continue}
    r.innerHTML=`<div class=top><span class=nm>${n}</span><div class=val><button>−</button><span>${fmt(o[k],s)}</span><button>+</button></div></div><input type=range min=${a} max=${b} step=${s} value=${o[k]}>`;
    const i=r.querySelector('input'),v=r.querySelector('span:not(.nm)'),[m,p]=r.querySelectorAll('button');
    const set=(x,sv)=>{x=Math.min(b,Math.max(a,+x));o[k]=Math.round(x/s)*s;o[k]=+o[k].toFixed(3);if(sv)persist(o);i.value=o[k];v.textContent=fmt(o[k],s)+(k==='regen'?'s':'');i.style.setProperty('--p',(o[k]-a)/(b-a)*100+'%')};
    set(o[k]);i.oninput=()=>set(i.value,1);i.onchange=()=>i.blur();m.onclick=()=>set(o[k]-s,1);p.onclick=()=>set(o[k]+s,1);B.appendChild(r)}}
const toggle=()=>{const o=$('m').style.display==='none';$('m').style.display=o?'flex':'none';$('open').style.display=o?'none':'block';tip.style.display='none'};
$('cls').onclick=$('open').onclick=toggle;$('rst').onclick=()=>{Sim.resetConfig();draw()};draw();
// ---- world (compact arena, tight ramps, floating hex platforms) ----
// 4-fold pinwheel: each ramp sits 21u behind its mid platform (clockwise tangent); high tier at center, 5 ramps total
const RAMPS=[[0,0],[-21,24],[24,21],[21,-24],[-24,-21]].map(([x,z])=>({x,z,hw:5.5,h:3.5})),
  PLATS=[{x:0,z:24,r:7,top:8.5,o:0},{x:24,z:0,r:7,top:8.5,o:1},{x:0,z:-24,r:7,top:8.5,o:0},{x:-24,z:0,r:7,top:8.5,o:1},{x:0,z:0,r:5,top:17.5,o:0,tier:'high'}];
// 4-fold symmetric starting pads on a ring (x,z,yaw), all facing the center
const PADS=[[0,-34,0],[34,0,-Math.PI/2],[0,34,Math.PI],[-34,0,Math.PI/2]],PN={p:'YOU',d1:'BOT 1',d2:'BOT 2'},spec={i:0};
const pad=(i,id,m,drive,decay)=>Sim.car(id,PADS[i][0],PADS[i][1],PADS[i][2],m,drive,decay);
const mk=()=>{const w=Sim.create({radius:36,ramps:RAMPS,plats:PLATS});
  w.cars.push(pad(0,'p',1),pad(2,'d1',1,false,false),pad(1,'d2',2,false,false));return w};
let w=mk();
// ---- render ----
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x12151d);sc.fog=new THREE.Fog(0x12151d,50,200);
const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,400);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
sc.add(new THREE.AmbientLight(0xffffff,.65));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(30,80,20);sc.add(dl);
const mat=(c)=>new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:6,specular:0x111111,side:THREE.DoubleSide});
const im=new THREE.InstancedMesh(new THREE.CylinderGeometry(Sim.S*.92,Sim.S*.92,.5,6),new THREE.MeshBasicMaterial(),w.list.length);
im.frustumCulled=false;sc.add(im);
const D=new THREE.Object3D(),col=new THREE.Color(),SH=[0x2b3550,0x313d5c,0x272f48],RED=0xd9473d;
let anim=[],rise=[];
const setM=(t,y,s=1)=>{D.position.set(t.x,y,t.z);D.scale.setScalar(s);D.updateMatrix();im.setMatrixAt(t.i,D.matrix)};
const shade=t=>SH[((t.q-t.r)%3+3)%3],OIL=0x4a1f7a,VIEWER='p'; // oil is drawn dark purple, hidden from a car once it has hit it
function paint(t){im.setColorAt(t.i,col.setHex(t.s===1?RED:t.o&&!t.oh.includes(VIEWER)?OIL:shade(t)))}
function initTiles(){anim=[];rise=[];for(const t of w.list){t._h=false;setM(t,-.25);im.setColorAt(t.i,col.setHex(shade(t)))}
  im.instanceMatrix.needsUpdate=im.instanceColor.needsUpdate=true}
initTiles();let bnUntil=0,seenOver=false;
const reset=()=>{Sim.resetRound(w);for(const c of w.cars){c.px=c.x;c.py=c.y;c.pz=c.z;c.pyaw=c.yaw}initTiles();seenOver=false;bnUntil=0;spec.i=0};
$('nr').onclick=reset;$('nr').onfocus=e=>e.target.blur();
for(const r of RAMPS){const m=new THREE.Mesh(new THREE.ConeGeometry(r.hw*Math.SQRT2,r.h,4),mat(0xe39b2d));
  m.rotation.y=Math.PI/4;m.position.set(r.x,r.h/2,r.z);sc.add(m)}
for(const p of w.plats){const m=new THREE.Mesh(new THREE.CylinderGeometry(p.r,p.r,p.th,6),mat(p.top>15?0xd4a24a:0x5a8f99));
  m.position.set(p.x,p.top-p.th/2,p.z);m.rotation.y=p.o?Math.PI/2:0;sc.add(m)} // floating: nothing underneath
// cars + deployable wings
const ws=new THREE.Shape();ws.moveTo(0,.7);ws.lineTo(2.4,-.2);ws.lineTo(2.4,-.9);ws.lineTo(0,-.7);
const wg=new THREE.ExtrudeGeometry(ws,{depth:.07,bevelEnabled:false});wg.rotateX(Math.PI/2);
const aura=(r,c,o)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,depthWrite:false}));m.visible=false;return m};
const cm=[0x3aa0ff,0xf2a33a,0xb26cf0].map(c=>{const g=new THREE.Group(),i=new THREE.Group();
  const bm=mat(c),km=mat(0xeef1f7),b=new THREE.Mesh(new THREE.BoxGeometry(1.8,.6,3.2),bm),k=new THREE.Mesh(new THREE.BoxGeometry(1.2,.5,1.4),km);
  k.position.set(0,.5,-.2);i.add(b,k);
  const wm=mat(0xeef1f7),wings=[1,-1].map(sd=>{const p=new THREE.Group();p.position.set(sd*.85,.35,.1);p.add(new THREE.Mesh(wg,wm));p.scale.x=.001;i.add(p);return p});
  const gh=aura(2.3,0xcfe8ff,.3),sd=aura(2.5,0x4cc4ff,.25),sm=new THREE.Mesh(new THREE.BoxGeometry(2.1,.45,.5),mat(0xff7a1a));sm.position.set(0,.05,1.75);sm.visible=false;
  g.add(i,gh,sd,sm);g.userData={i,wings,wk:0,gh,sd,sm,mats:[bm,km,wm],gs:false};sc.add(g);return g});
// power-up visuals
// Item coins. One definition drives the 3D pickup AND the HUD icon, so colors and labels always match.
const CC={boost:0x2ee6f0,smash:0xff5a1f,shield:0x9b5cf6,shock:0xffe135,collapse:0x8b1a1a,oil:0x26262b,ghost:0xd8f8f5}; // coin colors
const lite=(c,a)=>{const r=c>>16&255,g=c>>8&255,b=c&255,m=x=>Math.round(x+(255-x)*a);return m(r)<<16|m(g)<<8|m(b)};
const EC={};for(const k in CC)EC[k]=k==='ghost'?0x58c9d1:lite(CC[k],k==='oil'?.55:.5); // raised emblem colors
const hx=c=>'#'+c.toString(16).padStart(6,'0');
const ITM={boost:'SPEED BOOST',smash:'POWER SMASH',shield:'ENERGY SHIELD',shock:'SHOCKWAVE',collapse:'HEX COLLAPSE',oil:'OIL SLICK',ghost:'GHOST PHASE'};
const arc=(cx,cy,r,a0,a1,n)=>Array.from({length:n+1},(_,i)=>{const a=(a0+(a1-a0)*i/n)*Math.PI/180;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]});
const EMB={ // emblem primitives in coin units: p = closed outline polygon, r = ring, d = dot [x,y,radius]
 boost:[{p:[[.15,.6],[-.3,-.05],[-.02,-.05],[-.15,-.6],[.3,.08],[.03,.08]]}],                                   // lightning bolt
 smash:[{p:[[-.42,.52],[.42,.52],[.42,.14],[.08,.14],[.08,-.58],[-.08,-.58],[-.08,.14],[-.42,.14]]}],            // hammer
 shield:[{p:[[-.42,.5],[.42,.5],[.42,.08],[.3,-.18],[0,-.58],[-.3,-.18],[-.42,.08]]}],                          // shield
 shock:[{r:.58},{r:.34},{d:[0,0,.08]}],                                                                         // radial rings
 collapse:[{p:arc(0,0,.55,30,390,6).slice(0,6)}],                                                               // hexagon
 oil:[{p:[[0,.62],...arc(0,-.15,.38,20,-200,8)]}],                                                              // droplet
 ghost:[{p:[...arc(0,.12,.38,0,180,6),[-.38,-.5],[-.19,-.32],[0,-.5],[.19,-.32],[.38,-.5]]},{d:[-.14,.14,.06]},{d:[.14,.14,.06]}] // ghost
};
EMB.collapse=[{p:Array.from({length:6},(_,i)=>{const a=(30+60*i)*Math.PI/180;return[Math.cos(a)*.55,Math.sin(a)*.55]})}];
const svgIcon=ty=>`<svg viewBox="-1 -1 2 2">${EMB[ty].map(e=>e.p?`<polygon points="${e.p.map(q=>q[0].toFixed(2)+','+(-q[1]).toFixed(2)).join(' ')}"/>`:e.r?`<circle r="${e.r}"/>`:`<circle cx="${e.d[0]}" cy="${-e.d[1]}" r="${e.d[2]}" style="fill:var(--e);stroke:none"/>`).join('')}</svg>`;
const coinIcon=(ty,s)=>`<span class=ci style="--c:${hx(CC[ty])};--e:${hx(EC[ty])};width:${s}px;height:${s}px">${svgIcon(ty)}</span>`;
function makeCoin(type){ // floating 3D coin: cylinder + rim + raised emblem on BOTH faces
  const g=new THREE.Group(),T=.24,D=.08,gh=type==='ghost';
  const bm=new THREE.MeshPhongMaterial({color:CC[type],shininess:90,specular:0x999999,transparent:gh,opacity:gh?.7:1,side:THREE.DoubleSide});
  const em=new THREE.MeshPhongMaterial({color:EC[type],shininess:40,transparent:gh,opacity:gh?.92:1});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,T,36),bm);body.rotation.x=Math.PI/2;g.add(body);
  g.add(new THREE.Mesh(new THREE.TorusGeometry(.9,.055,8,36),em));
  const emb=new THREE.Group();
  for(const e of EMB[type]){
    if(e.p){const P=e.p;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],dx=b[0]-a[0],dy=b[1]-a[1];
      const m=new THREE.Mesh(new THREE.BoxGeometry(Math.hypot(dx,dy)+.07,.075,D),em);m.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,0);m.rotation.z=Math.atan2(dy,dx);emb.add(m)}}
    else if(e.r)emb.add(new THREE.Mesh(new THREE.TorusGeometry(e.r,.04,8,40),em));
    else{const m=new THREE.Mesh(new THREE.CylinderGeometry(e.d[2],e.d[2],D,12),em);m.rotation.x=Math.PI/2;m.position.set(e.d[0],e.d[1],0);emb.add(m)}}
  const bk=emb.clone();emb.position.z=T/2+D/2-.01;bk.position.z=-(T/2+D/2-.01);bk.rotation.y=Math.PI;g.add(emb,bk);return g}
const itemMesh={},rings=[];
function ring(x,z,R,c,d,y){const m=new THREE.Mesh(new THREE.RingGeometry(.92,1,48),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.6,side:THREE.DoubleSide,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(x,(y||0)+.3,z);sc.add(m);rings.push({m,t0:performance.now(),d,R})}
// ---- selftest ----
const det=(()=>{const run=()=>{const w=mk();let s=12345;for(let i=0;i<1800;i++){s=(s*1664525+1013904223)>>>0;
  Sim.step(w,{p:{steer:((s>>>8)%3)-1,jump:(s>>>4)%90===0}},DT)}return Sim.hash(w)};return run()===run()})();
// ---- loop ----
let acc=0,last=performance.now(),fps=60,sbHtml='',hudKey='';
function frame(now){const fd=Math.min((now-last)/1000,.1);last=now;acc+=fd;fps+=(1/fd-fps)*.05;
  while(acc>=DT){for(const c of w.cars){c.px=c.x;c.py=c.y;c.pz=c.z;c.pyaw=c.yaw}
    Sim.step(w,{p:{steer:(held('right')?1:0)-(held('left')?1:0),jump:jl,power:pl}},DT);jl=false;pl=false;acc-=DT}
  const a=acc/DT,L=(u,v)=>u+(v-u)*a;let ch=false;
  for(const t of w.redLog){im.setColorAt(t.i,col.setHex(RED));ch=true}
  for(const t of w.fallLog)anim.push(t);
  for(const t of w.regenLog){im.setColorAt(t.i,col.setHex(shade(t)));setM(t,-3.25);rise.push({t,t0:w.t});ch=true}
  w.redLog.length=w.fallLog.length=w.regenLog.length=0;
  for(let k=anim.length-1;k>=0;k--){const t=anim[k],d=w.t-t.ft,y=-.25-20*(t.fs||1)*d*d;
    if(t.s!==2)anim.splice(k,1);else if(y<-120){setM(t,-200,0);anim.splice(k,1)}else setM(t,y);ch=true}
  for(const t of w.oilLog){t._h=t.oh.includes(VIEWER);paint(t);ch=true}for(const t of w.oilClr){paint(t);ch=true}w.oilLog.length=w.oilClr.length=0;
  for(const t of w.oilList){const h=t.oh.includes(VIEWER);if(h!==t._h){t._h=h;paint(t);ch=true}}
  for(let k=rise.length-1;k>=0;k--){const q=rise[k],p=(w.t-q.t0)/.35; // respawned tile pops back up into place
    if(q.t.s===2||p>=1){if(q.t.s!==2)setM(q.t,-.25);rise.splice(k,1)}else setM(q.t,-.25-3*(1-p)*(1-p));ch=true}
  if(ch){im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true}
  w.cars.forEach((c,i)=>{const g=cm[i],u=g.userData;g.visible=c.alive;g.position.set(L(c.px??c.x,c.x),L(c.py??c.y,c.y)+.4,L(c.pz??c.z,c.z));
    g.rotation.y=L(c.pyaw??c.yaw,c.yaw);u.i.rotation.z=-c.roll;
    u.wk+=((c.st==='F'?1:0)-u.wk)*(1-Math.exp(-16*fd));const f=c.st==='F'?Math.sin(now*.012)*.08:0;
    u.wings.forEach((p,j)=>{const s=j?-1:1;p.scale.x=s*Math.max(.001,u.wk);p.rotation.z=s*(f+.1*u.wk)});
    const gt=c.ghostT>0;if(gt!==u.gs){u.gs=gt;u.mats.forEach(m=>{m.transparent=gt;m.opacity=gt?.35:1;m.depthWrite=!gt;m.needsUpdate=true})}
    u.gh.visible=gt;u.sd.visible=c.shield>0;if(c.shield>0)u.sd.material.opacity=.12+.07*c.shield;u.sm.visible=c.smashT>0});
  const p=w.cars[0],al=w.cars.map((c,i)=>i).filter(i=>w.cars[i].alive),cd=view.cam;
  const ti=p.alive?0:al.length?al[((spec.i%al.length)+al.length)%al.length]:-1; // spectator follows a survivor, else orbits the arena
  if(ti<0){const a=now*.0003;cam.position.lerp(new THREE.Vector3(Math.cos(a)*55,38,Math.sin(a)*55),1-Math.exp(-3*fd));cam.lookAt(0,0,0)}
  else{const g=cm[ti],yw=g.rotation.y,fx=Math.sin(yw),fz=Math.cos(yw),q=g.position,k=p.alive?1:1.7;
    cam.position.lerp(new THREE.Vector3(q.x-fx*cd*k,q.y+cd*.55*k,q.z-fz*cd*k),1-Math.exp(-8*fd));cam.lookAt(q.x+fx*6,q.y+1,q.z+fz*6)}
  // ---- power-ups: floating items, effect events, inventory HUD ----
  const live={};for(const it of w.items){live[it.id]=1;let m=itemMesh[it.id];
    if(!m){m=makeCoin(it.type);sc.add(m);itemMesh[it.id]=m}
    m.position.set(it.x,it.y+Math.sin(now*.003+it.id)*.2,it.z);m.rotation.y=now*.0016+it.id}
  for(const id in itemMesh)if(!live[id]){sc.remove(itemMesh[id]);delete itemMesh[id]}
  for(const e of w.events){const c=w.cars.find(c=>c.id===e.id);
    if(e.k==='shock')ring(e.x,e.z,e.r,0x7fd8ff,.5,e.y);else if(e.k==='collapse')ring(e.x,e.z,e.rad||5,0x8b1a1a,.5,0);
    else if(e.k==='shatter'&&c)ring(c.x,c.z,9,0xffb62e,.4,c.y);else if(e.k==='shield'&&c)ring(c.x,c.z,4,0x4cc4ff,.25,c.y)}
  w.events.length=0;
  for(let k=rings.length-1;k>=0;k--){const r=rings[k],a2=(now-r.t0)/(r.d*1000);if(a2>=1){sc.remove(r.m);rings.splice(k,1)}else{r.m.scale.setScalar(Math.max(.01,a2*r.R));r.m.material.opacity=.6*(1-a2)}}
  const pk=w.cars[0],hk=JSON.stringify([pk.inv,Math.ceil(pk.smashT),pk.shield,pk.boostT>0,Math.ceil(pk.ghostT),Math.ceil(pk.oilT),pk.alive]);
  if(hk!==hudKey){hudKey=hk;let h='<div class=slots>';for(let k=0;k<3;k++){const ty=pk.inv[k];
    h+=ty?`<div class="slot${k?'':' cur'}" style="--c:${hx(CC[ty])}">${coinIcon(ty,40)}<small>${ITM[ty]}</small>${k?'':'<em>'+kb.power[0].replace('Key','').toUpperCase()+'</em>'}</div>`:'<div class="slot empty"></div>'}
    h+='</div><div class=chips>';if(pk.smashT>0)h+=`<span>${coinIcon('smash',22)}${Math.ceil(pk.smashT)}s</span>`;if(pk.shield>0)h+=`<span>${coinIcon('shield',22)}×${pk.shield}</span>`;
    if(pk.boostT>0)h+=`<span>${coinIcon('boost',22)}BOOST</span>`;if(pk.ghostT>0)h+=`<span>${coinIcon('ghost',22)}${Math.ceil(pk.ghostT)}s</span>`;if(pk.oilT>0)h+=`<span>${coinIcon('oil',22)}${Math.ceil(pk.oilT)}s</span>`;
    $('inv').innerHTML=h+'</div>'}
  const fv=72+(pk.boostT>0?12:0);if(Math.abs(cam.fov-fv)>.05){cam.fov+=(fv-cam.fov)*(1-Math.exp(-8*fd));cam.updateProjectionMatrix()}
  const rd=w.round;if(rd.phase==='over'&&!seenOver){seenOver=true;bnUntil=now+3500}if(rd.phase==='play')seenOver=false;
  const bn=$('bn');if(now<bnUntil){bn.style.display='block';bn.innerHTML=rd.winner?`ROUND WINNER<small>${PN[rd.winner]||rd.winner} · +1 point</small>`:'DRAW<small>no survivors</small>'}else bn.style.display='none';
  const sp=$('sp');sp.style.display=p.alive?'none':'block';sp.textContent=p.alive?'':`ELIMINATED · spectating${al.length?' · '+(PN[w.cars[ti].id]||''):''} · ${kb.left[0].replace('Key','')}/${kb.right[0].replace('Key','')} switch`;
  const sh=w.cars.map(c=>`<span class="${c.id==='p'?'you':''} ${c.alive?'':'out'}">${PN[c.id]||c.id}<b>${w.scores[c.id]||0}</b></span>`).join('');
  if(sh!==sbHtml){sbHtml=sh;$('sb').innerHTML=sh}
  $('h').textContent=`${p.alive?{G:'GROUND',J:'JUMP',F:'FLIGHT',D:'DROP',X:'FALLING',C:'COYOTE'}[p.st]:'ELIMINATED'} · ${Math.hypot(p.vx,p.vz).toFixed(0)} u/s · alt ${p.y.toFixed(1)}\n${fps.toFixed(0)} fps · sim ${det?'deterministic':'DESYNC'}\njump: ${p.ev||'-'} · air ${p.gs}f\nR reset · H settings`;
  renderer.render(sc,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
