<!doctype html><meta charset=utf-8><title>Phase 1 Sandbox</title>
<style>

#zone{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:none;background:var(--bg);border-radius:10px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.06em;box-shadow:0 4px 0 #0d0f15;white-space:nowrap}#zone.hot{color:#ff7b72}
#uip{display:flex;gap:8px;padding:8px 12px 0;align-items:center}

input.num{width:72px;flex:none;background:#141720;border:2px solid #343c52;border-radius:8px;color:var(--tx);padding:5px 8px;font:700 12px inherit;text-align:right;outline:0;font-variant-numeric:tabular-nums;user-select:text}
input.num:focus{border-color:var(--ac)}input.num.clamped{border-color:var(--bad);background:#2a1618}input.num:only-child{flex:1;width:auto;text-align:left}

</style>
<div id=m><h1 id=mt>LOBBY SETTINGS</h1><div id=tabs></div><div id=body></div>
<div id=uip><button class=chip id=uiS>SLIDERS</button><button class=chip id=uiI>TEXT BOXES</button></div>

 <label>PLAYER NAME<input id=pname maxlength=14 placeholder="Player" autocomplete=off></label>
 <div class=cols id=cols>
  <div class=col><button class=btn id=hostBtn>HOST GAME</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script src="sim.js"></script>
<script>
/**
 * ARENA SURVIVAL - browser client.
 *
 * Responsibilities (in file order):
 *   1. input + key bindings           5. world rendering (three.js)
 *   2. settings schema + panel UI     6. networking (host-authoritative, client prediction, interpolation)
 *   3. lobby (host / join / kick)     7. main frame loop + HUD
 *   4. UI preferences
 *
 * Networking summary
 *   HOST   runs the one authoritative simulation (sim.js) at a fixed 60 Hz, buffers every player's input commands
 *          (jitter buffer, same depth for the host), and sends compact state snapshots at `netSnapshotRate` Hz.
 *   CLIENT predicts its OWN car locally with the same sim code (instant response), reconciles with the host's
 *          acknowledged state (replaying unacknowledged commands), and INTERPOLATES everybody else between
 *          host snapshots on the host's clock (smooth, jitter tolerant).
 *   TRANSPORT two PeerJS data channels per client: "ctl" (reliable: lobby, config, tile/oil/event deltas) and
 *          "game" (unreliable: input commands + state snapshots, so a lost packet never stalls the game).
 */

/** Fixed simulation step in seconds (must match the host). */
const DT = 1 / 60;
/** Live game configuration object shared with sim.js (host settings, synced to clients). */
const C = Sim.C;
/** Client-only view options (HUD visibility, chase-camera distance). */
const view = { hud: true, cam: 8.5 };

/**
 * Short DOM lookup.
 * @param {string} id - element id
 * @returns {HTMLElement} the element
 */
const $ = id => document.getElementById(id);

// ------------------------------------------------------------------ input ---

/** Key bindings per action (KeyboardEvent.code values); the player can remap them in the KEYS tab. */
const kb = { left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], jump: ['KeyW', 'ArrowUp'], power: ['Space'] };
try { Object.assign(kb, JSON.parse(localStorage.kb)); } catch (e) { /* no saved bindings */ }
/** Human-readable action names for the KEYS tab. */
const NAMES = { left: 'Steer left', right: 'Steer right', jump: 'Jump / flight', power: 'Use power-up' };

/** Currently pressed key codes. */
const down = new Set();
/**
 * Whether any key bound to an action is held.
 * @param {string} a - action name (left/right/jump/power)
 * @returns {boolean} true while held
 */
const held = a => kb[a].some(c => down.has(c));

// Mutable UI / input state.
let rb = null;               // action currently being re-bound (waiting for a key), or null
let tab = 'DRIVE';           // active settings tab
let jl = false, pl = false;  // latched fresh jump / power presses, consumed by the next simulation tick
let mode = 'lobby';          // 'lobby' | 'offline' | 'host' | 'client'
let panelOpen = false;       // floating settings panel open (during a match)
let drawSig = '';            // 'H' (host/offline: full settings) or 'C' (client: keys only) - what the panel last drew
let dockedNow = false;       // settings panel currently docked inside the lobby screen

/**
 * Network / lobby state. See the header comment for the protocol.
 * @type {{role:string, peer:object|null, conns:Object, gconns:Object, tok:Object, cq:Object, hseq:number,
 *   hostConn:object|null, gameConn:object|null, roster:Array, myId:string, code:string, live:boolean, scores:Object,
 *   interAt:number, cn:number, snaps:Array, lastT:number, clk:object, pred:object, rtt:number, sendT:number,
 *   cfgT:number, d:object}}
 */
const net = {
  role: 'none',      // 'none' | 'host' | 'client'
  peer: null,        // PeerJS peer
  conns: {},         // host: reliable control connection per client id
  gconns: {},        // host: unreliable game connection per client id
  tok: {},           // host: secret token per client id (binds the game channel to the right client)
  cq: {},            // host: input command queue per player id
  hseq: 0,           // host: sequence counter for the host's own commands
  hostConn: null,    // client: reliable control connection to the host
  gameConn: null,    // client: unreliable game connection to the host (null = fall back to hostConn)
  roster: [],        // [{id, name, sc?}] lobby players
  myId: 'p',         // my car id ('p' = host / offline)
  code: '',          // room code
  live: false,       // a round is running (false = lobby / intermission)
  scores: {},        // cumulative scores across rounds in this room
  interAt: 0,        // time at which the post-round intermission starts
  cn: 0,             // host: client counter for unique ids
  snaps: [],         // client: interpolation buffer of host snapshots (by host time)
  lastT: -1,         // client: host time of the newest snapshot received
  clk: { off: null, jit: 0, lastArr: 0, lastT: 0 }, // client: host-clock estimate + arrival jitter
  pred: { seq: 0, pending: [], corr: { x: 0, y: 0, z: 0 } }, // client: prediction state
  rtt: 0,            // client: smoothed round-trip time (ms)
  sendT: 0,          // host: time accumulator for the snapshot timer
  cfgT: 0,           // host: debounce timer for config broadcasts
  d: { ts: new Set(), os: new Set(), ev: [] } // host: tile / oil / event changes since the last broadcast
};

/**
 * Escapes text for safe use in innerHTML.
 * @param {*} s - any value
 * @returns {string} HTML-escaped string
 */
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

/**
 * Cleans a player name: strips control characters and angle brackets, trims, limits to 14 characters.
 * @param {*} s - raw name
 * @returns {string} safe name ('Player' if empty)
 */
const cleanName = s => String(s || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 14) || 'Player';

/**
 * The name currently typed in the lobby name box.
 * @returns {string} cleaned name
 */
const myName = () => cleanName($('pname').value);

/**
 * Whether the local player may edit game rules (host or offline practice).
 * @returns {boolean} true for host / offline
 */
function canEdit() { return mode === 'offline' || net.role === 'host'; }

/**
 * Post-match intermission: connected to a room but no round running (lobby screen shows again, same room).
 * @returns {boolean} true during intermission
 */
function inter() { return (mode === 'host' || mode === 'client') && !net.live; }

/**
 * Whether the lobby overlay is on screen (initial lobby or intermission).
 * @returns {boolean} true if the lobby is visible
 */
function overlayOn() { return mode === 'lobby' || inter(); }

/**
 * Keydown handler: key re-binding, spectator switching, latching fresh jump/power presses, host hotkeys.
 * Typing in text boxes never triggers game keys.
 * @param {KeyboardEvent} e - the event
 * @returns {void}
 */
function onKeyDown(e) {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName || '')) return;
  if (rb) { // waiting for the new key of a binding
    kb[rb] = [e.code];
    try { localStorage.kb = JSON.stringify(kb); } catch (_) { /* storage blocked */ }
    rb = null; draw(); e.preventDefault(); return;
  }
  down.add(e.code);
  if (!overlayOn() && !me().alive) { // spectating: steer keys cycle through survivors
    if (kb.left.includes(e.code)) spec.i--;
    if (kb.right.includes(e.code)) spec.i++;
  }
  if (!e.repeat && kb.jump.includes(e.code)) jl = true;
  if (!e.repeat && kb.power.includes(e.code)) pl = true;
  if (e.code === 'KeyR') doReset();
  if (e.code === 'KeyH') toggle();
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
}
addEventListener('keydown', onKeyDown);
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => { down.clear(); jl = false; pl = false; });

// ------------------------------------------------------------- UI settings ---

/** Per-device UI preferences: which numeric controls the settings menu shows. */
const uiPrefs = (() => {
  const d = { sliders: true, inputs: true };
  try { Object.assign(d, JSON.parse(localStorage['rsr.ui.v1'])); } catch (e) { /* defaults */ }
  return d;
})();

/**
 * Saves the UI preferences to localStorage.
 * @returns {void}
 */
const saveUi = () => { try { localStorage['rsr.ui.v1'] = JSON.stringify(uiPrefs); } catch (e) { /* storage blocked */ } };

/**
 * Creates a DOM element.
 * @param {string} tag - tag name
 * @param {string} [cls] - class name
 * @param {string} [txt] - text content
 * @returns {HTMLElement} the new element
 */
const mkEl = (tag, cls, txt) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
};

/** Unit suffix shown next to numeric settings. */
const UNIT = {
  regen: 's', mapShrinkInitialDelay: 's', mapShrinkInterval: 's', ghostPhaseDuration: 's', ghostPhaseCooldown: 's',
  oilSlickSlipDuration: 's', quantumDuration: 's', powerSmashDuration: 's', shieldDuration: 's', hexCollapseWarningTime: 's',
  fallDelay: 's', rollTime: 's', pickupSpawnMinDelay: 's', pickupSpawnMaxDelay: 's', boostTime: 's', oilTime: 's', oilLife: 's',
  netInterpDelay: 'ms', netSnapshotRate: 'Hz', netInputDelay: 'ticks'
};

/**
 * Formats seconds as m:ss.
 * @param {number} s - seconds
 * @returns {string} e.g. "1:59"
 */
const fmtT = s => { const q = Math.ceil(s); return Math.floor(q / 60) + ':' + String(q % 60).padStart(2, '0'); };

// ----------------------------------------------------------- settings schema ---
/**
 * Settings schema: tab -> rows. A row is [object, key, label, min, max, step, tooltip] for numbers or
 * [object, key, label, 'toggle', tooltip] for switches. Rows bind to the shared config `C` (host-only) or to UI / view options.
 */
const G={
 DRIVE:[[C,'speed','Cruise speed',10,60,1,'Constant forward speed of every car.'],
  [C,'steer','Steering rate',.5,6,.1,'How fast the car turns while a steer key is held.'],
  [C,'grip','Ground grip',1,20,.5,'Low = slidey and drifty. High = car snaps to where you point.'],
  [C,'air','Air control',0,10,.5,'Grip while airborne. Low = you keep drifting along your launch direction.']],
 AIR:[[C,'gravity','Gravity',10,100,1,'Fall speed. Higher = snappier, shorter jumps.'],
  [C,'jumpV','Jump force',5,40,.5,'Upward kick of a ground hop.'],
  [C,'rampJump','Ramp jump bonus',0,1,.05,'Extra jump power from ramp speed when you jump on a ramp.'],
