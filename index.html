<!doctype html><meta charset=utf-8><title>Phase 1 Sandbox</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel=stylesheet>
<style>
body{margin:0;overflow:hidden;background:#05010f;font:13px Orbitron,'Trebuchet MS',sans-serif;color:#cfeaff}canvas{display:block}
#m{position:fixed;top:12px;left:12px;width:360px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:linear-gradient(#150a38ee,#07031cee);
 border:2px solid #00e5ff;border-radius:14px;box-shadow:0 0 24px #00e5ff66,inset 0 0 18px #7a2cff44}
#m h1{margin:0;padding:12px 16px 4px;font-size:20px;font-weight:800;letter-spacing:3px;color:#fff;text-shadow:0 0 10px #ff2bd6,0 0 22px #00e5ff}
#m small{padding:0 16px 8px;color:#8ba;font-size:10px;letter-spacing:1px}
#tabs{display:flex;gap:4px;padding:0 10px}
#tabs button{flex:1;padding:7px 2px;font:800 9px Orbitron,sans-serif;letter-spacing:1px;background:#1b0f4a;color:#9bd;border:1px solid #4a3a9a;border-radius:8px 8px 0 0;cursor:pointer}
#tabs button.on{background:#00e5ff;color:#001;box-shadow:0 0 12px #00e5ff}
#body{overflow:auto;padding:10px 16px;flex:1}
.row{margin-bottom:13px}.row b{display:flex;justify-content:space-between;font-size:12px;color:#fff;letter-spacing:1px}
.row b i{font-style:normal;color:#ffd23f;text-shadow:0 0 8px #ffd23f88}.row p{margin:2px 0 4px;font:11px 'Trebuchet MS',sans-serif;color:#9ab}
input[type=range]{width:100%;accent-color:#ff2bd6}
.kb{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kb button,#foot button{font:800 11px Orbitron,sans-serif;background:#1b0f4a;color:#00e5ff;border:2px solid #00e5ff;border-radius:8px;padding:6px 12px;cursor:pointer}
.kb button:hover,#foot button:hover{background:#00e5ff;color:#001}
#foot{padding:8px 16px 12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #4a3a9a}
#open{position:fixed;top:12px;left:12px;display:none;font:800 12px Orbitron,sans-serif;background:#150a38;color:#00e5ff;border:2px solid #00e5ff;border-radius:10px;padding:8px 14px;cursor:pointer}
#h{position:fixed;top:12px;right:14px;text-align:right;white-space:pre;font:800 13px Orbitron,sans-serif;text-shadow:0 0 8px #00e5ff}
</style>
<div id=m><h1>HOST SETTINGS</h1><small>LIVE PHYSICS TUNING · CHANGES APPLY INSTANTLY</small><div id=tabs></div><div id=body></div>
<div id=foot><button id=rst>RESTORE DEFAULTS</button><button id=cls>CLOSE [H]</button></div></div>
<button id=open>⚙ SETTINGS [H]</button><div id=h></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="sim.js"></script>
<script>
const DT=1/60,C=Sim.C,$=id=>document.getElementById(id);
// ---- remappable input ----
const kb={left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],jump:['KeyW','ArrowUp'],power:['Space']};
try{Object.assign(kb,JSON.parse(localStorage.kb))}catch(e){}
const down=new Set(),held=a=>kb[a].some(c=>down.has(c));let rb=null,tab='DRIVING';
const NAMES={left:'STEER LEFT',right:'STEER RIGHT',jump:'JUMP / FLIGHT',power:'USE POWER-UP'};
addEventListener('keydown',e=>{
  if(rb){kb[rb]=[e.code];try{localStorage.kb=JSON.stringify(kb)}catch(_){}rb=null;draw();e.preventDefault();return}
  down.add(e.code);if(e.code==='KeyR')reset();if(e.code==='KeyH')toggle();
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>down.delete(e.code));
// ---- host settings UI ----
const G={
 DRIVING:[['speed','Cruise Speed',10,60,1,'Constant forward speed of every car. Higher = faster but harder to place precisely.'],
  ['steer','Steering Rate',.5,6,.1,'How fast the car turns while a steer key is held.'],
  ['grip','Ground Grip',1,20,.5,'How fast velocity snaps to where you point. Low = drifty and slidey, high = tight and responsive.'],
  ['air','Air Control',0,10,.5,'Same as grip, but while airborne. Low = you keep floating in your launch direction.']],
 JUMP:[['gravity','Gravity',10,100,1,'Fall speed. Higher = snappier, shorter jumps.'],
  ['jumpV','Jump Force',5,40,.5,'Upward kick of a ground hop. Sets how high a single jump goes.'],
  ['rampJump','Ramp Jump Bonus',0,1,.05,'Extra jump power from ramp speed when you jump while on a ramp.'],
  ['flightLift','Flight Lift',0,50,1,'Upward kick when flight engages. Main control for how high flight can climb.'],
  ['flightDamp','Flight Smoothing',.5,8,.1,'How quickly the lift fades into a glide. Low = long, high climbs.'],
  ['flightSink','Glide Sink',0,10,.5,'How fast the car drops while gliding. 0 = floats level.'],
  ['flightMul','Flight Speed Boost',1,2,.05,'Forward speed multiplier while flying.'],
  ['rollTime','Barrel Roll Time',.2,1.5,.05,'Seconds for the visual roll when jumping while steering.']],
 CRASH:[['bump','Bump Force',.5,4,.1,'Knockback strength on car-to-car hits. Higher = harder shoves.'],
  ['rest','Bounciness',0,1,.05,'0 = cars stick and shove, 1 = full rebound.']],
 FLOOR:[['fallDelay','Tile Fall Delay',.1,3,.1,'Seconds between a tile turning red and dropping into the abyss.']]};
const TABN={DRIVING:'DRIVE',JUMP:'AIR',CRASH:'CRASH',FLOOR:'FLOOR',KEYS:'KEYS'};
function draw(){
  $('tabs').innerHTML='';for(const t in TABN){const b=document.createElement('button');b.textContent=TABN[t];b.className=t===tab?'on':'';
    b.onclick=()=>{tab=t;draw()};$('tabs').appendChild(b)}
  const B=$('body');B.innerHTML='';
  if(tab==='KEYS'){B.innerHTML='<p style="color:#9ab;font:11px sans-serif">Click a button, then press the new key. Saved on this device.</p>';
    for(const a in kb){const r=document.createElement('div');r.className='kb';r.innerHTML=`<b>${NAMES[a]}</b>`;
      const b=document.createElement('button');b.textContent=rb===a?'PRESS A KEY…':kb[a].join(' / ');b.onclick=()=>{rb=a;draw()};r.appendChild(b);B.appendChild(r)}return}
  for(const[k,n,a,b,s,d]of G[tab]){const r=document.createElement('div');r.className='row';
    r.innerHTML=`<b>${n}<i>${C[k]}</i></b><p>${d}</p><input type=range min=${a} max=${b} step=${s} value=${C[k]}>`;
    const i=r.querySelector('input'),o=r.querySelector('i');
    i.oninput=()=>{C[k]=+i.value;o.textContent=i.value};i.onchange=()=>i.blur();B.appendChild(r)}}
const toggle=()=>{const o=$('m').style.display==='none';$('m').style.display=o?'flex':'none';$('open').style.display=o?'none':'block'};
$('cls').onclick=$('open').onclick=toggle;$('rst').onclick=()=>{Object.assign(C,Sim.DEFAULTS);draw()};draw();
// ---- world ----
const RAMPS=[[0,28],[-56,-62],[56,-62],[0,-40],[30,10]].map(([x,z])=>({x,z,hw:8,h:6})),
  PLATS=[{x:0,z:60,hw:20,top:12},{x:-56,z:-30,hw:16,top:12},{x:56,z:-30,hw:16,top:12},{x:-56,z:10,hw:12,top:25}];
const mk=()=>{const w=Sim.create({radius:72,ramps:RAMPS,plats:PLATS});
  w.cars.push(Sim.car('p',0,-72,0,1),Sim.car('d1',15,-10,0,1,false),Sim.car('d2',-15,10,0,2,false));return w};
let w=mk();
// ---- render ----
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x05010f);sc.fog=new THREE.Fog(0x05010f,60,260);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,600);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
sc.add(new THREE.AmbientLight(0x8060ff,.7));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(40,100,20);sc.add(dl);
const neon=(c,i=.8)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i,flatShading:true,side:THREE.DoubleSide});
const edge=new THREE.LineBasicMaterial({color:0x00e5ff});
// instanced hex floor
const im=new THREE.InstancedMesh(new THREE.CylinderGeometry(Sim.S*.92,Sim.S*.92,.5,6),new THREE.MeshBasicMaterial(),w.list.length);
im.frustumCulled=false;sc.add(im);
const D=new THREE.Object3D(),col=new THREE.Color(),SH=[0x1a1a78,0x22228a,0x2a1a70],RED=0xff1030;
let ri=0,fi=0,anim=[];
const setM=(t,y,s=1)=>{D.position.set(t.x,y,t.z);D.scale.setScalar(s);D.updateMatrix();im.setMatrixAt(t.i,D.matrix)};
function initTiles(){ri=fi=0;anim=[];for(const t of w.list){setM(t,-.25);im.setColorAt(t.i,col.setHex(SH[((t.q-t.r)%3+3)%3]))}
  im.instanceMatrix.needsUpdate=im.instanceColor.needsUpdate=true}
initTiles();const reset=()=>{w=mk();initTiles()};
for(const r of RAMPS){const m=new THREE.Mesh(new THREE.ConeGeometry(r.hw*Math.SQRT2,r.h,4),neon(0xff00cc,.7));
  m.rotation.y=Math.PI/4;m.position.set(r.x,r.h/2,r.z);sc.add(m)}
for(const p of PLATS){const m=new THREE.Mesh(new THREE.BoxGeometry(p.hw*2,p.top,p.hw*2),neon(p.top>20?0xffcc00:0x00ff88,.45));
  m.position.set(p.x,p.top/2,p.z);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),edge));sc.add(m)}
// cars (+ deployable wings)
const ws=new THREE.Shape();ws.moveTo(0,.7);ws.lineTo(2.6,-.2);ws.lineTo(2.6,-.9);ws.lineTo(0,-.7);
const wg=new THREE.ExtrudeGeometry(ws,{depth:.07,bevelEnabled:false});wg.rotateX(Math.PI/2);
const cm=[0x00e5ff,0xffaa00,0xaa66ff].map(c=>{const g=new THREE.Group(),i=new THREE.Group(),mt=neon(c);
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,.6,3.2),mt),k=new THREE.Mesh(new THREE.BoxGeometry(1.2,.5,1.4),neon(0xffffff,.3));
  k.position.set(0,.5,-.2);i.add(b,k);
  const wm=neon(0xff2bd6,1.4),wings=[1,-1].map(sd=>{const p=new THREE.Group();p.position.set(sd*.85,.35,.1);
    const m=new THREE.Mesh(wg,wm);m.rotation.y=sd>0?-Math.PI/2:Math.PI/2;m.rotation.x=0;p.add(m);p.scale.x=.001;i.add(p);return p});
  g.add(i);g.userData={i,mt,wings,wk:0};sc.add(g);return g});
// ---- selftest ----
const det=(()=>{const run=()=>{const w=mk();let s=12345;for(let i=0;i<1800;i++){s=(s*1664525+1013904223)>>>0;
  Sim.step(w,{p:{steer:((s>>>8)%3)-1,jump:(s>>>4)%90===0}},DT)}return Sim.hash(w)};return run()===run()})();
// ---- loop ----
let acc=0,last=performance.now(),fps=60;
function frame(now){const fd=Math.min((now-last)/1000,.1);last=now;acc+=fd;fps+=(1/fd-fps)*.05;
  while(acc>=DT){for(const c of w.cars){c.px=c.x;c.py=c.y;c.pz=c.z;c.pyaw=c.yaw}
    Sim.step(w,{p:{steer:(held('right')?1:0)-(held('left')?1:0),jump:held('jump')}},DT);acc-=DT;
    const p=w.cars[0];if(p.y<-60)Object.assign(p,{x:0,z:-60,y:6,vx:0,vy:0,vz:0,yaw:0,st:'A'})}
  const a=acc/DT,L=(u,v)=>u+(v-u)*a;
  let ch=false;
  for(;ri<w.redLog.length;ri++){im.setColorAt(w.redLog[ri].i,col.setHex(RED));ch=true}
  for(;fi<w.fallLog.length;fi++)anim.push(w.fallLog[fi]);
  for(let k=anim.length-1;k>=0;k--){const t=anim[k],d=w.t-t.ft,y=-.25-20*d*d;
    if(y<-120){setM(t,-200,0);anim.splice(k,1)}else setM(t,y);ch=true}
  if(ch){im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true}
  w.cars.forEach((c,i)=>{const g=cm[i],u=g.userData;g.position.set(L(c.px??c.x,c.x),L(c.py??c.y,c.y)+.4,L(c.pz??c.z,c.z));
    g.rotation.y=L(c.pyaw??c.yaw,c.yaw);u.i.rotation.z=-c.roll;u.mt.emissiveIntensity=c.st==='F'?2.2:.8;
    u.wk+=((c.st==='F'?1:0)-u.wk)*(1-Math.exp(-16*fd));const f=c.st==='F'?Math.sin(now*.012)*.08:0;
    u.wings.forEach((p,j)=>{const s=j?-1:1;p.scale.x=Math.max(.001,u.wk);p.rotation.z=s*(f+.1*u.wk)})});
  const g=cm[0],p=w.cars[0],yw=g.rotation.y,fx=Math.sin(yw),fz=Math.cos(yw),q=g.position;
  cam.position.lerp(new THREE.Vector3(q.x-fx*11,q.y+6,q.z-fz*11),1-Math.exp(-8*fd));cam.lookAt(q.x+fx*8,q.y+1,q.z+fz*8);
  $('h').textContent=`${{G:'GROUND',A:'AIR',F:'FLIGHT',D:'DROP'}[p.st]}  ·  ${Math.hypot(p.vx,p.vz).toFixed(0)} u/s  ·  alt ${p.y.toFixed(1)}\nfps ${fps.toFixed(0)} · sim ${det?'DETERMINISTIC':'DESYNC'}\nR reset · H settings`;
  R.render(sc,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
